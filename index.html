<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-content: cuando sale el teclado, la pantalla se encoge
       y la barra de captura sube con él (si no, en Android el teclado la taparía). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Mis gastos</title>
  <meta name="description" content="Apunta tus gastos escribiendo frases cortas. Sin cuentas, todo se guarda en tu móvil.">
  <!-- Versión de este index.html: app.js la compara con la suya y, si no coinciden, repara la copia guardada. -->
  <meta name="version-cascara" content="6">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#edeff4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)">
  <script>
    /* Aplica los colores del tema elegido ANTES de pintar nada (evita el parpadeo al abrir).
       js/temas.js guarda esta copia cada vez que cambias de tema. */
    (function () {
      try {
        var c = JSON.parse(localStorage.getItem('gastos-app/tema-vars') || 'null');
        if (!c) return;
        var oscuro = c.modo === 'oscuro' || (c.modo === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        var vars = oscuro ? c.oscuro : c.claro, raiz = document.documentElement;
        for (var k in vars) raiz.style.setProperty(k, vars[k]);
        raiz.style.colorScheme = oscuro ? 'dark' : 'light';
      } catch (e) { /* sin tema guardado: se usan los colores por defecto */ }
    })();
  </script>
  <script>
    /* Red de seguridad: si la app no llega a arrancar (falta algún archivo en el repositorio, hay versiones
       mezcladas...), en vez de dejar la pantalla en blanco enseña qué ha pasado y qué archivos faltan.
       Si añades archivos nuevos a la app, añádelos también a esta lista. */
    (function () {
      var ARCHIVOS = [
        'index.html', 'service-worker.js', 'css/estilos.css',
        'js/app.js', 'js/almacen.js', 'js/analisis.js', 'js/categorias.js', 'js/csv.js', 'js/graficas.js',
        'js/idb.js', 'js/pagos.js', 'js/parser.js', 'js/temas.js', 'js/utils.js'
      ];
      var ultimoError = '';
      var mostrada = false;

      function arrancada() {
        var c = document.getElementById('cabecera');
        return Boolean(c && c.children.length);
      }
      function mostrar() {
        if (mostrada || arrancada()) return;
        mostrada = true;
        var caja = document.createElement('div');
        caja.id = 'fallo-carga';
        caja.setAttribute('role', 'alert');
        caja.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:99;overflow:auto;padding:28px 22px;background:#fff;color:#14161f;color-scheme:light;font:16px/1.5 system-ui,sans-serif';
        caja.innerHTML = '<h1 style="font-size:1.25rem;margin:0 0 10px">La app no ha podido arrancar</h1><div id="fallo-cuerpo"><p>Comprobando archivos…</p></div>';
        document.body.appendChild(caja);
        comprobar();
      }
      function comprobar() {
        var pendientes = ARCHIVOS.length, faltan = [];
        ARCHIVOS.forEach(function (a) {
          fetch(a, { cache: 'no-store' })
            .then(function (r) { if (!r.ok) faltan.push(a); })
            .catch(function () { faltan.push(a); })
            .then(function () { if (--pendientes === 0) resumen(faltan.sort()); });
        });
      }
      function resumen(faltan) {
        var cuerpo = document.getElementById('fallo-cuerpo');
        cuerpo.innerHTML = '';
        function p(texto, estilo) { var e = document.createElement('p'); e.textContent = texto; if (estilo) e.style.cssText = estilo; cuerpo.appendChild(e); return e; }
        if (faltan.length) {
          p('Faltan estos archivos en tu repositorio de GitHub (o están en otra carpeta):');
          var ul = document.createElement('ul'); ul.style.cssText = 'padding-left:22px;font-weight:600';
          faltan.forEach(function (a) { var li = document.createElement('li'); li.textContent = a; ul.appendChild(li); });
          cuerpo.appendChild(ul);
          p('Súbelos cada uno a su carpeta (Add file → Upload files) y abre la app dos veces.');
        } else {
          p('Están todos los archivos, pero alguno es de una versión antigua y no encaja con los demás. Vuelve a subir TODOS los archivos de la última entrega y abre la app dos veces.');
        }
        if (ultimoError) p('Detalle técnico: ' + ultimoError, 'font-size:.8125rem;color:#555;word-break:break-word');
        var b = document.createElement('button');
        b.textContent = 'Reintentar';
        b.style.cssText = 'margin-top:8px;min-height:48px;padding:0 24px;border:0;border-radius:14px;background:#14161f;color:#fff;font:600 1rem system-ui,sans-serif';
        b.onclick = function () { location.reload(); };
        cuerpo.appendChild(b);
      }

      window.addEventListener('error', function (e) { ultimoError = (e && e.message) || ultimoError; setTimeout(mostrar, 700); });
      window.addEventListener('unhandledrejection', function (e) {
        ultimoError = String((e && e.reason && e.reason.message) || (e && e.reason) || ultimoError);
        setTimeout(mostrar, 700);
      });
      window.__falloCarga = function () { setTimeout(mostrar, 300); };
      setTimeout(mostrar, 8000); // por si no llega ningún aviso de error
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/app.js" onerror="__falloCarga()"></script>
</head>
<body>
  <div id="app">
    <!-- Cabecera: navegación de mes (la rellena app.js) -->
    <header id="cabecera" class="cabecera"></header>

    <!-- Vista activa: Resumen, Historial o Ajustes (la rellena app.js) -->
    <main id="vista" class="vista" tabindex="-1"></main>

    <!-- Zona inferior fija: captura de gastos + pestañas -->
    <footer class="dock">
      <div class="captura">
        <div class="segmentado segmentado-dock" id="metodo" role="radiogroup" aria-label="Método de pago">
          <button type="button" role="radio" data-metodo="cuenta" aria-checked="true">💳 Cuenta</button>
          <button type="button" role="radio" data-metodo="efectivo" aria-checked="false">💵 Efectivo</button>
        </div>
        <form id="captura" autocomplete="off">
          <input id="frase" type="text" enterkeyhint="done" autocapitalize="sentences"
                 autocomplete="off" spellcheck="false" aria-label="Nuevo gasto"
                 placeholder="Ej: 3,50 en cafetería uni">
          <button type="submit" class="btn-enviar" aria-label="Añadir gasto">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
      </div>

      <nav class="tabs" aria-label="Secciones">
        <button type="button" data-vista="resumen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
          <span>Resumen</span>
        </button>
        <button type="button" data-vista="historial">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
          <span>Historial</span>
        </button>
        <button type="button" data-vista="pagos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <span>Pagos</span>
          <!-- Contador de pagos pendientes (lo rellena app.js) -->
          <b class="insignia" id="insignia-pagos" hidden></b>
        </button>
        <button type="button" data-vista="cuentas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/><path d="M16 15h2"/></svg>
          <span>Cuentas</span>
        </button>
        <button type="button" data-vista="ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
          <span>Ajustes</span>
        </button>
      </nav>
    </footer>
  </div>

  <!-- Hoja inferior de confirmación / edición (la rellena app.js) -->
  <div id="hoja" hidden></div>

  <!-- Avisos breves (con botón "Deshacer" cuando toca) -->
  <div id="aviso" role="status" aria-live="polite"></div>

  <noscript><p style="padding:1rem">Esta app necesita JavaScript activado.</p></noscript>
</body>
</html>
